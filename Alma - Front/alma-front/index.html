<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF9FA">
  <meta name="description" content="ALMA: compare preços de perfumes, acompanhe o histórico e receba alertas quando o preço cair.">
  <title>ALMA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231A1A1A'/%3E%3Ctext x='32' y='44' font-family='Arial' font-weight='700' font-size='34' text-anchor='middle' fill='%23D3AF37'%3EA%3C/text%3E%3C/svg%3E">
  <script>
    /* Aplica o modo noturno salvo antes de desenhar a página (evita piscar em branco) */
    (function () {
      try {
        var salvo = JSON.parse(localStorage.getItem("alma:estado:v1"));
        var tema = salvo && salvo.preferencias && salvo.preferencias.tema;
        if (tema === "auto") {
          var daPagina = document.documentElement.getAttribute("data-theme");
          tema = daPagina ? (daPagina === "dark" ? "escuro" : "claro")
            : (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro");
        }
        if (tema === "escuro") document.documentElement.setAttribute("data-tema", "escuro");
      } catch (e) { /* sem armazenamento: começa no tema claro */ }
    })();
  </script>
  <link rel="stylesheet" href="css/fonte.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-base="nada">
  <!-- Aqui o JavaScript desenha a tela atual (veja js/telas.js) -->
  <div class="app" id="app"></div>

  <!-- Aviso rápido (toast) e painel inferior (bottom sheet) usados por todas as telas -->
  <div class="aviso" id="aviso" role="status" aria-live="polite" popover="manual"></div>
  <dialog class="painel" id="painel" aria-labelledby="painel-titulo"></dialog>

  <!-- Ordem importa: cada arquivo usa o que foi carregado antes dele -->
  <script src="js/icones.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/componentes.js"></script>
  <script src="js/telas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
